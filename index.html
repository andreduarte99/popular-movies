<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Filmes Populares</title>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/styles.css" />
    <style type="text/tailwindcss">
      @layer utilities {
        .primaria {
          background-color: #131224;
        }
      }
    </style>
  </head>

  <body
    class="flex flex-col items-center bg-[#131224] gap-[2rem] font-[--primaria]"
  >
    <h1 class="text-3xl font-semibold text-white mt-[2rem]">
      Filmes Populares
    </h1>
    <!--Barra de pesquisa-->
    <div class="relative w-96 font-medium">
      <input
        type="text"
        placeholder="Digite algum filme para pesquisar..."
        class="w-full py-2 pl-4 pr-10 rounded-lg text-white bg-gray-700"
      />
      <img
        class="absolute top-[12px] right-[15px] w-[16px] h-[16px]"
        src="./imgs/search-icon.svg"
        alt="Ícone de pesquisa"
        alt="Ícone de pesquisa"
      />
    </div>
    <!--Checkbox com texto-->
    <div class="flex items-center">
      <input type="checkbox" id="checkbox" class="mr-2" />
      <label for="checkbox" class="text-white font-semibold"
        >Mostrar apenas meus filmes favoritos</label
      >
    </div>
    <!--Lista de filmes-->
    <section
      class="flex flex-col gap-[2rem] text-white w-[50%] font-medium"
    ></section>

    <script src="./scripts/index.js"></script>
  </body>
</html>
